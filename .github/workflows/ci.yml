name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier
            target
            project/target
            */target
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Compile all projects
        run: sbt compile

      - name: Run tests
        run: sbt test

      - name: Build backend assembly
        run: sbt backend/assembly

      - name: Build frontend (Scala.js + Vite)
        run: |
          sbt frontend/fullLinkJS
          cd frontend && npx vite build

      - name: Check formatting
        run: sbt scalafmtCheckAll
        continue-on-error: true

      - name: Notify on failure
        if: failure() && vars.N8N_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          curl -s -X POST "${{ vars.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"event\": \"ci_failure\",
              \"repo\": \"${{ github.repository }}\",
              \"branch\": \"${{ github.head_ref }}\",
              \"pr\": \"${{ github.event.pull_request.number }}\",
              \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
