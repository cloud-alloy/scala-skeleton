name: Auto-Fix Request
description: Request an automated fix (triggers AI-powered PR generation)
title: "[Auto-Fix]: "
labels: ["auto-fix"]
body:
  - type: markdown
    attributes:
      value: |
        This template triggers automated fix generation. After submission, the issue-to-PR workflow will attempt to generate a fix automatically.

        **Tip:** Be as specific as possible about the problem and desired outcome for best results.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue that needs fixing
      placeholder: |
        What needs to be fixed? Be specific about:
        - Which file(s) are affected
        - What the current behaviour is
        - What the correct behaviour should be
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: How will we know the fix is correct?
      placeholder: |
        - [ ] The function returns the correct value
        - [ ] The test passes
        - [ ] No compilation errors
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Frontend
        - Backend
        - Infrastructure
        - Shared
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: Relevant Files
      description: List any specific files that may need changes
      placeholder: |
        - backend/src/main/scala/Server.scala
        - shared/src/main/scala/shared/Message.scala

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Error messages, stack traces, or other helpful context
      render: shell
